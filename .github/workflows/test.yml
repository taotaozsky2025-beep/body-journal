name: Synthetic tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node tests/stats.cjs
      - shell: pwsh
        run: |
          $errorsFound=@()
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            $parseErrors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$parseErrors)
            $errorsFound+=$parseErrors
          }
          if($errorsFound.Count){$errorsFound;exit 1}
